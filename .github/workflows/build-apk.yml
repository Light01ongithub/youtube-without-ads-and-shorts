name: Build YouTube Pure APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: bash ./gradlew assembleDebug --stacktrace

      - name: Prepare Named APK
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/*.apk release-apk/YouTubePure-v1.1.0.apk
          ls -la release-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubePure-v1.1.0-APK
          path: release-apk/YouTubePure-v1.1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases (Phone Accessible)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "YouTube Pure v1.1.0 (Liquid Glass Edition)"
          body: |
            ### 📱 Download YouTube Pure v1.1.0
            Tap **`YouTubePure-v1.1.0.apk`** below to download and install directly on your Android phone.

            #### 🌟 What's New in v1.1.0:
            - 💎 **Liquid Glass UI**: Frosted glassmorphic header, bottom navigation bar, and filter chips.
            - 🚫 **Removed "Open in App"**: Purged all sticky install banners, app-switch prompts, and upsells.
            - 🔄 **Swipe-to-Refresh**: Native pull-down to refresh feeds with YouTube red progress indicator.
            - ⏪⏩ **Double-Tap Seek**: Double-tap left/right on video to jump ±10s with frosted glass ripple feedback.
            - 📺 **Native Picture-in-Picture (PiP)**: Video minimizes to a floating window when returning to home screen.
            - 🚫 **No Shorts**: Bottom tab & infinite scrolling shelves completely eliminated.
            - 🚫 **Zero Video Ads**: Multi-layer ad domain filtering and automatic video ad-skip.
            - 🎧 **Background Playback**: Audio continues playing with screen turned off.
          files: release-apk/YouTubePure-v1.1.0.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Action Summary
        run: |
          echo "## 📱 Android APK Ready for Direct Phone Download" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The APK has been packaged and published directly to **GitHub Releases**:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Specific File Name**: \`YouTubePure-v1.1.0.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Release Page**: [View Release & Download APK](https://github.com/${{ github.repository }}/releases/tag/v1.1.0)" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct APK Download URL**: \`https://github.com/${{ github.repository }}/releases/download/v1.1.0/YouTubePure-v1.1.0.apk\`" >> $GITHUB_STEP_SUMMARY
