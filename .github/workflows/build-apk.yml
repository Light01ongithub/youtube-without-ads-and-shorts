name: Build YouTube Pure APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: bash ./gradlew assembleDebug --stacktrace

      - name: Prepare Named APK
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/*.apk release-apk/YouTubePure-v1.2.0.apk
          ls -la release-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubePure-v1.2.0-APK
          path: release-apk/YouTubePure-v1.2.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases (Phone Accessible)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "YouTube Pure v1.2.0 (Ultimate Feature Edition)"
          body: |
            ### 📱 Download YouTube Pure v1.2.0
            Tap **`YouTubePure-v1.2.0.apk`** below to download and install directly on your Android phone.

            #### 🌟 All Features in v1.2.0:
            - 🚫 **No Shorts**: Bottom tab & infinite scrolling reels completely eliminated.
            - 🚫 **Zero Video Ads & Banners**: Ad-blocking at network level + auto-skip.
            - 🚫 **No 'Open in App' Annoyance**: All sticky banners and Play Store redirects purged.
            - 💎 **Liquid Glass UI**: Frosted acrylic glass navigation, floating cards, and AMOLED dark mode.
            - ⚡ **Hold for 2× Speed**: Press and hold video player to watch at double speed; release to restore.
            - ⏪⏩ **Double-Tap Seek**: Double-tap left/right on video for ±10s jump with liquid glass pill feedback.
            - 🔒 **Player Screen Lock**: Lock button on player overlay to prevent accidental palm touches.
            - 🔁 **Loop Video**: One-tap toggle to continuously loop current video.
            - ⏱️ **Sleep Timer**: Built-in sleep timer to auto-pause playback after chosen minutes.
            - ↗️ **Native Android Share**: Opens Android's system share sheet for video sharing.
            - 👎 **Return YouTube Dislike**: Live dislike count integration under videos.
            - 📺 **Native Picture-in-Picture (PiP)**: Minimizes to floating window when returning to home screen.
            - 🎧 **Background & Screen-Off Play**: Keeps playing audio when phone screen is locked.
            - 🔄 **Swipe-to-Refresh**: Native pull-down feed refresh with custom red indicator.
            - 🔑 **Google Sign-in Fixed**: Clean Chrome Mobile UA allows logging into your Google Account without 'disallowed_useragent' errors.
          files: release-apk/YouTubePure-v1.2.0.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Action Summary
        run: |
          echo "## 📱 Android APK Ready for Direct Phone Download" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The APK has been packaged and published directly to **GitHub Releases**:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Specific File Name**: \`YouTubePure-v1.2.0.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Release Page**: [View Release & Download APK](https://github.com/${{ github.repository }}/releases/tag/v1.2.0)" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct APK Download URL**: \`https://github.com/${{ github.repository }}/releases/download/v1.2.0/YouTubePure-v1.2.0.apk\`" >> $GITHUB_STEP_SUMMARY
