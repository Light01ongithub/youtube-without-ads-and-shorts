name: Build YouTube Pure APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: bash ./gradlew assembleDebug --stacktrace

      - name: Prepare Named APK
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/*.apk release-apk/YouTubePure-v1.3.0.apk
          ls -la release-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubePure-v1.3.0-APK
          path: release-apk/YouTubePure-v1.3.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases (Phone Accessible)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "YouTube Pure v1.3.0 (Native Mobile & Watch Controls Edition)"
          body: |
            ### 📱 Download YouTube Pure v1.3.0
            Tap **`YouTubePure-v1.3.0.apk`** below to download and install directly on your Android phone.

            #### 🌟 What's New in v1.3.0:
            - 🎬 **Preserved YouTube Native Theme**: Blends smoothly with YouTube mobile typography, native action bar styling, and light/dark theme.
            - 🎯 **Precise Shorts Filtering**: Card-specific filtering ensures neighboring long-form videos in mixed feeds are never accidentally hidden.
            - ⚡ **Playback Speed Selector**: Dedicated speed selector (`0.5×` to `2×`) in the watch tools bar with live player sync.
            - 🔒 **Enhanced Player Lock**: Fullscreen unlock button shield attached directly to the video player.
            - 🏠 **Instant Shorts Redirection**: Any navigation to `/shorts` routes redirects straight to Home (`/`).
            - 🚀 **Performance & Battery Boost**: Eliminated CPU interval loops, reducing battery usage.
            - 🚫 **No Video Ads & Banners**: Ad-blocking at network level + auto-skipping.
            - 🚫 **No 'Open in App' Annoyance**: All sticky banners and Play Store redirects purged.
            - 📺 **Native Picture-in-Picture (PiP)**: Minimizes to floating window when returning to home screen.
            - 🎧 **Background & Screen-Off Play**: Keeps playing audio when phone screen is locked.
            - 🔄 **Swipe-to-Refresh**: Native pull-down feed refresh with custom red indicator.
            - 🔑 **Google Sign-in**: Clean Chrome Mobile UA allows logging into your Google Account without 'disallowed_useragent' errors.
          files: release-apk/YouTubePure-v1.3.0.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Action Summary
        run: |
          echo "## 📱 Android APK Ready for Direct Phone Download" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The APK has been packaged and published directly to **GitHub Releases**:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Specific File Name**: \`YouTubePure-v1.3.0.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Release Page**: [View Release & Download APK](https://github.com/${{ github.repository }}/releases/tag/v1.3.0)" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct APK Download URL**: \`https://github.com/${{ github.repository }}/releases/download/v1.3.0/YouTubePure-v1.3.0.apk\`" >> $GITHUB_STEP_SUMMARY
