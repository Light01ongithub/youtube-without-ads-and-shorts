name: Repository CI & Action Control

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      action_message:
        description: 'Message or task description to trigger'
        required: false
        default: 'Manual trigger test'

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Environment
        run: |
          echo "GitHub Actions is configured and operational."
          echo "Triggered by: ${{ github.event_name }}"
          echo "Input message: ${{ github.event.inputs.action_message }}"
